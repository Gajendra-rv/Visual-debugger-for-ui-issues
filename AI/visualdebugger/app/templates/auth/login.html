{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page" id="auth-login-page">
  <div class="auth-bg-effects">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="auth-container">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="auth-brand-name">Vision<span>UI</span></h1>
      <p class="auth-brand-tagline">AI Visual Debugging Agent</p>
    </div>

    <!-- Card -->
    <div class="auth-card" id="login-card">
      <div class="auth-card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your debugging console</p>
      </div>

      {% if error %}
      <div class="auth-error" id="login-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            Password
            <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-password" onclick="togglePassword('password')" id="toggle-pwd">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full" id="login-submit">
          <span>Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="demo-creds" id="demo-credentials">
        <p class="demo-label">🚀 Demo Credentials</p>
        <button type="button" class="demo-btn" id="fill-demo-admin" onclick="fillDemo('admin@debugger.ai','Admin@123')">
          Admin Account
        </button>
        <button type="button" class="demo-btn" id="fill-demo-user" onclick="fillDemo('dhanush@debugger.ai','Dhanush@123')">
          User Account
        </button>
      </div>

      <p class="auth-switch">
        Don't have an account?
        <a href="{{ url_for('auth.signup') }}" id="go-signup">Create one →</a>
      </p>
    </div>
  </div>
</div>

<script>
function fillDemo(email, password) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = password;
}
function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
