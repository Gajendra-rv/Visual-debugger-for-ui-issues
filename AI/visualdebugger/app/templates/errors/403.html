{% extends "base.html" %}
{% block title %}403 — Forbidden{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">403</div>
    <h1 class="error-title">Access Forbidden</h1>
    <p class="error-sub">You don't have permission to access this resource.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn-primary" id="back-home-403">← Back to Dashboard</a>
  </div>
</div>
{% endblock %}
