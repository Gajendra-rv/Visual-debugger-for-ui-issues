{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-sub">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn-primary" id="back-home-btn">← Back to Dashboard</a>
  </div>
</div>
{% endblock %}
